<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory pressure test page</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #f4f4f4; }
  #panel {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: #222; color: #fff; padding: 8px 12px; font-size: 13px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  #panel button { padding: 4px 10px; cursor: pointer; }
  #stats { font-family: monospace; white-space: pre; }
  #content { margin-top: 64px; padding: 8px; }
  .tile { display: block; width: 100%; max-width: 900px; height: auto;
          margin: 0 auto 12px auto; background: #ddd; }
  .label { text-align: center; color: #555; font-size: 12px; margin-bottom: 20px; }
  .text { max-width: 900px; margin: 0 auto 24px auto; line-height: 1.6; color: #333; }
</style>
</head>
<body>
<div id="panel">
  <span>tiles: <span id="tileCount">0</span></span>
  <button id="scrollBtn">자동 스크롤 시작/정지</button>
  <button id="resetBtn">통계 초기화</button>
  <span id="stats"></span>
</div>
<div id="content"></div>

<script>
// 설정: ?n=200&w=1200&h=900&speed=6 형태로 바꿀 수 있음
const params = new URLSearchParams(location.search);
const N = parseInt(params.get('n') || '200', 10);
const W = parseInt(params.get('w') || '1200', 10);
const H = parseInt(params.get('h') || '900', 10);
const SPEED = parseFloat(params.get('speed') || '6');

const content = document.getElementById('content');
const tileCountEl = document.getElementById('tileCount');
const statsEl = document.getElementById('stats');

// 원본 이미지를 캔버스로 생성한 뒤 Blob URL로 변환해 실제 디코딩이 일어나도록 함
function makeTileBlob(index) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const hue = (index * 37) % 360;
  const grad = g.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, `hsl(${hue}, 70%, 55%)`);
  grad.addColorStop(1, `hsl(${(hue + 120) % 360}, 70%, 35%)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);
  // 노이즈성 도형으로 PNG 압축 비용과 디코딩 비용을 키움
  let seed = index * 9973 + 1;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 400; i++) {
    g.fillStyle = `rgba(${Math.floor(rnd() * 255)}, ${Math.floor(rnd() * 255)}, ${Math.floor(rnd() * 255)}, 0.6)`;
    g.beginPath();
    g.arc(rnd() * W, rnd() * H, 4 + rnd() * 60, 0, Math.PI * 2);
    g.fill();
  }
  g.fillStyle = '#000';
  g.font = `${Math.floor(H / 12)}px sans-serif`;
  g.fillText(`#${index}`, 24, H / 8);
  return new Promise(resolve => c.toBlob(resolve, 'image/png'));
}

async function build() {
  const urls = [];
  for (let i = 0; i < N; i++) {
    const blob = await makeTileBlob(i);
    urls.push(URL.createObjectURL(blob));
    tileCountEl.textContent = String(i + 1);
  }
  const frag = document.createDocumentFragment();
  for (let i = 0; i < N; i++) {
    const p = document.createElement('p');
    p.className = 'text';
    p.textContent = `섹션 ${i}: 이 문단은 레이아웃과 텍스트 래스터 부하를 주기 위한 본문입니다. ` +
                    '스크롤 중 다시 그려지는 영역이 커지도록 여러 줄로 구성합니다. '.repeat(3);
    frag.appendChild(p);

    const img = document.createElement('img');
    img.className = 'tile';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.width = 900;
    img.height = Math.round(900 * H / W);
    img.src = urls[i];
    frag.appendChild(img);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = `image ${i} (${W}x${H})`;
    frag.appendChild(label);
  }
  content.appendChild(frag);
}

// 프레임 간격 측정: 50ms 이상 걸린 프레임을 끊김으로 계산
let lastTs = performance.now();
let maxFrame = 0, jankCount = 0, frames = 0, frameSum = 0;
function measure(ts) {
  const dt = ts - lastTs;
  lastTs = ts;
  frames++;
  frameSum += dt;
  if (dt > maxFrame) maxFrame = dt;
  if (dt > 50) jankCount++;
  requestAnimationFrame(measure);
}
requestAnimationFrame(measure);

function renderStats() {
  const avg = frames ? (frameSum / frames) : 0;
  let heap = '';
  if (performance.memory) {
    heap = `\njsHeap: ${(performance.memory.usedJSHeapSize / 1048576).toFixed(1)} MB`;
  }
  statsEl.textContent =
    `frames: ${frames}  avg: ${avg.toFixed(1)}ms  max: ${maxFrame.toFixed(0)}ms  jank(>50ms): ${jankCount}` + heap;
}
setInterval(renderStats, 1000);

document.getElementById('resetBtn').onclick = () => {
  maxFrame = 0; jankCount = 0; frames = 0; frameSum = 0;
};

// 자동 스크롤: 위아래로 왕복하며 래스터와 디코딩을 반복 유발
let scrolling = false, dir = 1;
function step() {
  if (!scrolling) return;
  window.scrollBy(0, SPEED * dir);
  const bottom = document.documentElement.scrollHeight - window.innerHeight;
  if (window.scrollY >= bottom) dir = -1;
  if (window.scrollY <= 0) dir = 1;
  requestAnimationFrame(step);
}
document.getElementById('scrollBtn').onclick = () => {
  scrolling = !scrolling;
  if (scrolling) requestAnimationFrame(step);
};

build();
</script>
</body>
</html>
